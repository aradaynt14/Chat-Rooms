<div id="room-tab">
  <div id="x-button">
    <button class="room-button" onclick="closeRoomTab()"><img src="img/x_icon.webp" width="16" height="16" ></button>
  </div>
  <div id ="room-title">
    <h1 id="room-text">Rooms:</h1>
    <button class="room-button" onclick="getRoomCodes()"><i class="fa fa-refresh"></i></button>
    <button class="room-button" id="create-button" onclick="newRoom()"><i class="fa fa-plus"></i> create</button>
  </div>
  <ul id="room-list">
    <li><button>SOME</button></li>
  </ul>
</div>

<div id="main">
  <div class="top-nav">
    <a class="top-nav-text">CSCI 2020U CHAT ROOMS</a>
    <a href="about.html">About us</a>
  </div>

  <div>
    <button onclick="openRoomTab()" class="room-button" id="bars"><i class="fa fa-bars"></i>Rooms</button>
    <input id="room-code-input" type="text"/>
    <button id="room-btn" onclick="enterInput()">Enter Room Code</button>
  </div>


  <div id="text-area">
    <textarea title="Chat Log" class="text" id="log" readonly placeholder="Hello, select or join a chat room"></textarea>
    <div id="message-area">
      <input title="Chat Input" id="input" type="text" />
      <button id="send-button">Send</button>
      <div class="dropdown">
        <button id="emoji-button"><i class="fa fa-smile-o"></i></button>
        <div id="emoji-dropdown" class="dropdown-content">

        </div>
      </div>
    </div>
  </div>
</div>
